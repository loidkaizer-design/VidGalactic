<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Galactic V5 — Movie Player</title>
<meta name="description" content="TMDB movie embed player.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23000'/%3E%3Cpath d='M25 18v28l24-14z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#040404;--ink:#f2f2f2;--dim:rgba(255,255,255,.62);--faint:rgba(255,255,255,.38);--line:rgba(255,255,255,.14);--line2:rgba(255,255,255,.34);--mono:'Space Mono',ui-monospace,SFMono-Regular,monospace;--disp:'Space Grotesk',system-ui,sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink);font-family:var(--disp);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0}
html,body{margin:0;width:100%;min-height:0;background:#000;overflow:hidden}
.player-only{width:100%;margin:0;padding:0}
.player-mount{width:min(100vw,177.7778dvh);height:auto;aspect-ratio:16/9;max-height:100dvh;margin:0 auto;background:#000}

/* Error banner */
#error-banner{position:fixed;top:0;left:0;right:0;background:rgba(200,30,30,.92);color:#fff;font-family:var(--mono);font-size:11px;padding:10px 16px;z-index:2000;text-align:center;display:none;backdrop-filter:blur(4px)}
#error-banner .err-close{margin-left:12px;cursor:pointer;text-decoration:underline}

/* Toast */
.toast-zone{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:1100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:100%}
.toast{font-family:var(--mono);font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.85);border:1px solid var(--line2);padding:13px 22px;backdrop-filter:blur(8px);animation:toastIn .3s ease,toastOut .45s ease 3s forwards;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
@keyframes toastIn{from{opacity:0;transform:translateY(14px)}}@keyframes toastOut{to{opacity:0;transform:translateY(10px)}}

/* Player */
.fplayer{position:relative;width:100%;height:100%;background:#000;overflow:hidden;user-select:none;-webkit-user-select:none;outline:none;font-family:'Fredoka',sans-serif}
.fplayer .vid{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain;background:#000}
.fplayer .poster-overlay{position:absolute;inset:0;background:#000;z-index:1;transition:opacity .6s ease}
.fplayer .poster-overlay.hidden{opacity:0;pointer-events:none}
.fplayer .poster-art{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.06) brightness(.62);transition:background-image .4s ease}
.fplayer .poster-scrim{position:absolute;inset:0;background:radial-gradient(ellipse 120% 95% at 50% 42%,transparent 40%,rgba(0,0,0,.72) 100%)}
.fplayer .poster-msg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:88%;text-align:center;font-family:'Space Mono',monospace;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.85);text-shadow:0 0 22px rgba(0,0,0,.9)}
.fplayer .center-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12);backdrop-filter:blur(12px);border:2px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:10;transition:all .3s cubic-bezier(.4,0,.2,1);box-shadow:0 8px 32px rgba(0,0,0,.35)}
.fplayer .center-play.hidden{opacity:0;transform:translate(-50%,-50%) scale(.5);pointer-events:none}
.fplayer .center-play svg{fill:#fff}
.fplayer .loading-backdrop{position:absolute;inset:0;z-index:5;background:transparent;opacity:1;visibility:visible;transition:opacity .45s ease,visibility .45s ease;pointer-events:none}
.fplayer .loading-backdrop.hidden{opacity:0;visibility:hidden}
.fplayer .buffer-loader{position:absolute;left:50%;top:50%;width:40px;height:40px;display:none;align-items:center;justify-content:center;transform:translate(-50%,-50%);z-index:6}
.fplayer .loading-backdrop:not(.hidden) .buffer-loader{display:flex}
.fplayer .buffer-loader div{border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;width:100%;height:100%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fplayer .bottom-controls{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:12px 18px;z-index:10;opacity:0;transition:opacity .4s ease}
.fplayer.show-controls .bottom-controls{opacity:1}
.fplayer .ctrl-btn{background:transparent;border:none;color:rgba(255,255,255,.85);cursor:pointer;padding:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s ease}
.fplayer .ctrl-btn svg{fill:currentColor;display:block;width:18px;height:18px}
.fplayer .play-bottom{width:44px;height:44px}
.fplayer .captionsBtn{position:relative}
.fplayer .subtitles-menu{position:absolute;bottom:calc(100% + 10px);right:0;background:rgba(12,12,12,.94);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:6px;min-width:220px;opacity:0;visibility:hidden;transform:translateY(6px) scale(.95);transition:all .22s cubic-bezier(.4,0,.2,1);z-index:120;box-shadow:0 8px 40px rgba(0,0,0,.55)}
.fplayer .subtitles-menu.open{opacity:1;visibility:visible;transform:translateY(0) scale(1)}
.fplayer .subtitles-header{font-size:11px;color:rgba(255,255,255,.5);padding:6px 12px 8px;text-transform:uppercase;letter-spacing:1px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:6px}
.fplayer .sub-item{display:flex;align-items:center;justify-content:space-between;width:100%;padding:10px 12px;background:transparent;border:none;border-radius:8px;color:rgba(255,255,255,.75);font-size:14px;font-weight:500;cursor:pointer;text-align:left;transition:all .15s;gap:10px}
.fplayer .sub-item:hover{background:rgba(255,255,255,.08);color:#fff}
.fplayer .sub-item.active{background:rgba(255,255,255,.12);color:#fff}
.fplayer .sub-check{opacity:0;transition:opacity .15s}
.fplayer .sub-item.active .sub-check{opacity:1}
.fplayer .sub-item.loading{color:rgba(255,255,255,.4);cursor:default}

/* Info / debug panel */
#info-panel{position:fixed;bottom:10px;right:10px;background:rgba(0,0,0,.7);color:#fff;font-family:var(--mono);font-size:10px;padding:8px 12px;border-radius:6px;border:1px solid var(--line);z-index:1000;display:none;max-width:300px}
#info-panel .info-row{margin:4px 0}
#info-panel .info-label{color:var(--faint)}
#info-panel .info-value{color:#fff;font-weight:bold}
</style>
</head>
<body>
  <div id="error-banner"></div>
  <div id="info-panel"></div>
  <main class="player-only">
    <div class="player-mount" id="mount"></div>
  </main>
  <div class="toast-zone" id="toast-zone"></div>
<script>
(function(){
  'use strict';

  var mount = document.getElementById('mount');
  var pageTitle = document.getElementById('page-title');
  var errorBanner = document.getElementById('error-banner');
  var infoPanel = document.getElementById('info-panel');

  function getTmdbId(){
    var m = window.location.pathname.match(/\/e\/movie\/([0-9]+)/i);
    return m ? m[1] : null;
  }

  function showError(msg){
    errorBanner.textContent = msg;
    errorBanner.style.display = 'block';
    var close = document.createElement('span');
    close.className = 'err-close';
    close.textContent = '✕';
    close.onclick = function(){ errorBanner.style.display = 'none'; };
    errorBanner.appendChild(close);
  }

  function toast(msg,ms){var t=document.createElement('div');t.className='toast';t.textContent=msg;document.getElementById('toast-zone').appendChild(t);setTimeout(function(){t.remove();},ms||3000);}

  function info(key,val){
    infoPanel.style.display = 'block';
    var row = document.createElement('div');
    row.className = 'info-row';
    row.innerHTML = '<span class="info-label">'+key+':</span> <span class="info-value">'+val+'</span>';
    infoPanel.appendChild(row);
  }

  function fetchJSON(url){
    return fetch(url,{headers:{'Accept':'application/json','X-Requested-With':'XMLHttpRequest'}}).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();});
  }

  /* ---- player DOM ---- */
  var root = document.createElement('div');root.className='fplayer';mount.appendChild(root);
  root.innerHTML =
    '<video class="vid" preload="metadata" playsinline webkit-playsinline></video>'+
    '<div class="poster-overlay"><div class="poster-art"></div><div class="poster-scrim"></div><div class="poster-msg"></div></div>'+
    '<div class="loading-backdrop"><div class="buffer-loader"><div></div></div></div>'+
    '<div class="center-play"><svg viewBox="0 0 24 24"><path fill="#fff" d="M8 5v14l11-7z"/></svg></div>'+
    '<div class="bottom-controls">'+
      '<button class="ctrl-btn play-bottom" title="Play/Pause"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg></button>'+
      '<button type="button" class="ctrl-btn captionsBtn" title="Subtitles"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><line x1="8" y1="7" x2="16" y2="7"/></svg></button>'+
      '<div class="subtitles-menu"><div class="subtitles-header">Subtitles</div><div class="sub-list"></div></div>'+
    '</div>';
  var video=root.querySelector('.vid');
  var posterOverlay=root.querySelector('.poster-overlay');
  var posterArt=root.querySelector('.poster-art');
  var posterMsg=root.querySelector('.poster-msg');
  var centerPlay=root.querySelector('.center-play');
  var playBtn=root.querySelector('.play-bottom');
  var captionsBtn=root.querySelector('.captionsBtn');
  var subList=root.querySelector('.sub-list');
  var subMenu=root.querySelector('.subtitles-menu');

  var hls=null, currentSource=null, currentSubtitles=[], retryCount=0, MAX_RETRIES=3;
  var DEFAULT_LANG='en';

  function setLoading(l){
    var lb=root.querySelector('.loading-backdrop');
    lb.classList.toggle('hidden',!l);
  }
  function togglePlay(){if(video.paused){video.play().catch(function(){});}else{video.pause();}}
  function syncIcons(){}

  playBtn.onclick=function(e){e.stopPropagation();togglePlay();};
  centerPlay.onclick=function(e){e.stopPropagation();togglePlay();};
  video.onclick=function(){togglePlay();};
  video.onplay=function(){centerPlay.classList.add('hidden');posterOverlay.classList.add('hidden');setLoading(false);retryCount=0;};
  video.onpause=function(){centerPlay.classList.remove('hidden');};
  video.onwaiting=function(){setLoading(true);};
  video.oncanplay=function(){setLoading(false);};
  video.onerror=function(){
    setLoading(false);
    centerPlay.classList.remove('hidden');
    var err = video.error;
    var msg = 'Unknown video error';
    if(err){
      switch(err.code){
        case 1: msg = 'MEDIA_ERR_ABORTED: Fetching aborted'; break;
        case 2: msg = 'MEDIA_ERR_NETWORK: Network download failed'; break;
        case 3: msg = 'MEDIA_ERR_DECODE: Decode failed (unsupported format)'; break;
        case 4: msg = 'MEDIA_ERR_SRC_NOT_SUPPORTED: Source not supported'; break;
      }
      msg += ' (' + (err.message||'') + ')';
    }
    showError('Video error: ' + msg + ' — retrying stream...');
    console.log('[VIDEO ERROR]', err);
    retryStream();
  };

  window.addEventListener('error', function(e){
    if(e.filename && e.filename.includes('hls')){
      console.log('[HLS JS LOAD ERROR]', e.message);
      showError('hls.js failed to load: ' + (e.message||'Unknown'));
    }
  }, true);

  /* ---- subtitles (client-side) ---- */
  function clearSubs(){
    currentSubtitles=[];
    for(var i=0;i<video.textTracks.length;i++)video.textTracks[i].mode='disabled';
    renderSubMenu();
  }
  function addSub(url,lang,name){
    var tr=document.createElement('track');
    tr.kind='subtitles';
    tr.srclang=lang||'und';
    tr.label=name||lang||'Subtitle';
    tr.src=url;
    video.appendChild(tr);
    currentSubtitles.push({url:url,lang:lang,name:name,track:tr});
    renderSubMenu();
    return tr;
  }
  function enableSub(idx){
    for(var i=0;i<video.textTracks.length;i++)video.textTracks[i].mode=i===idx?'showing':'disabled';
    renderSubMenu();
    var s=currentSubtitles[idx];
    captionsBtn.title=s?'Subtitles: '+(s.name||s.lang):'Subtitles';
  }
  function renderSubMenu(){
    if(!subList)return;
    var html='<div class="subtitles-header">Subtitles</div>';
    if(currentSubtitles.length===0){
      html+='<div class="sub-item" style="color:rgba(255,255,255,.4);cursor:default;">None available</div>';
      subList.innerHTML=html;
      return;
    }
    currentSubtitles.forEach(function(s,i){
      var active=video.textTracks[i]&&video.textTracks[i].mode==='showing';
      html+='<button class="sub-item'+(active?' active':'')+'" data-index="'+i+'">'+(s.name||s.lang||'Subtitle')+'<span class="sub-check'+(active?'':' ')+'">✔</span></button>';
    });
    subList.innerHTML=html;
    root.querySelectorAll('.sub-item[data-index]').forEach(function(b){
      b.onclick=function(e){e.stopPropagation();enableSub(parseInt(this.dataset.index,10));subMenu.classList.remove('open');};
    });
  }
  function toggleSubMenu(e){
    e.stopPropagation();
    renderSubMenu();
    subMenu.classList.toggle('open');
  }
  captionsBtn.onclick=toggleSubMenu;

  /* ---- load movie via proxy ---- */
  function loadMovie(streamUrl, subs){
    if(hls){try{hls.destroy();}catch(e){}hls=null;}
    video.removeAttribute('src');
    clearSubs();
    currentSource=streamUrl;
    setLoading(true);
    posterOverlay.classList.remove('hidden');
    centerPlay.classList.remove('hidden');

    var proxyUrl = '/proxy?url=' + encodeURIComponent(streamUrl);

    if(/m3u8/i.test(streamUrl)&&window.Hls&&window.Hls.isSupported()){
      hls=new Hls({
        maxBufferLength:30,
        xhrSetup:function(xhr,url){
          xhr.setRequestHeader('Referer','https://nextgencloudfabric.com/');
          xhr.setRequestHeader('Origin','https://nextgencloudfabric.com');
        }
      });
      hls.loadSource(proxyUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR,function(event,data){
        setLoading(false);
        centerPlay.classList.remove('hidden');
        retryCount++;
        var type = data.type||'unknown';
        var details = data.details||'unknown';
        var fatal = data.fatal?'FATAL':'non-fatal';
        console.log('[HLS ERROR]', {type:type, details:details, fatal:fatal, response:data.response, url:data.url});
        showError('HLS error ['+type+'] '+details+' ('+fatal+') — retry '+retryCount+'/'+MAX_RETRIES+'…');
        if(retryCount<=MAX_RETRIES){
          setTimeout(function(){ retryStream(); }, 2000);
        } else {
          showError('HLS stream failed after '+MAX_RETRIES+' retries. Check console for details.');
        }
      });
    } else {
      video.src = proxyUrl;
      video.onerror = function(){
        retryCount++;
        if(retryCount<=MAX_RETRIES){
          showError('Direct load failed — retry '+retryCount+'/'+MAX_RETRIES+'…');
          setTimeout(function(){ loadMovie(streamUrl, subs); }, 2000);
        } else {
          showError('Failed to load stream after '+MAX_RETRIES+' retries.');
        }
      };
    }

    // Client-side subtitle fetching
    if(subs&&subs.length>0){
      subs.forEach(function(s){if(s&&s.url)addSub(s.url,s.code||s.lang||'und',s.name||s.code||s.lang||'Subtitle');});
      var check=setInterval(function(){
        if(video.textTracks&&video.textTracks.length>0){
          clearInterval(check);
          var ti=-1;
          if(DEFAULT_LANG){
            for(var k=0;k<video.textTracks.length;k++){
              if(String((video.textTracks[k].srclang||'')).toLowerCase()===DEFAULT_LANG.toLowerCase()){ti=k;break;}
            }
          }
          if(ti<0&&video.textTracks.length>0)ti=0;
          if(ti>=0)enableSub(ti);
          renderSubMenu();
        }
      },100);
      setTimeout(function(){clearInterval(check);},5000);
    }
  }

  /* ---- retry stream with fresh URL ---- */
  function retryStream(){
    retryCount++;
    if(retryCount<=MAX_RETRIES){
      showError('Stream expired — fetching fresh URL ('+retryCount+'/'+MAX_RETRIES+')…');
      // Re-fetch movie API to get a fresh signed stream URL
      fetchJSON('/e/movie/'+encodeURIComponent(tmdbId)).then(function(json){
        var data=json.data||{};
        var streamUrls=data.stream_urls||[];
        if(streamUrls&&streamUrls.length>0){
          loadMovie(streamUrls[0], currentSubtitles.map(function(s){return {url:s.url,lang:s.lang,name:s.name};}));
        } else {
          showError('No stream URLs available after retry.');
        }
      }).catch(function(err){
        showError('Failed to refresh stream: '+String(err.message||err));
      });
    } else {
      showError('Failed to load stream after '+MAX_RETRIES+' retries. Try refreshing the page.');
    }
  }

  /* ---- main ---- */
  var tmdbId=getTmdbId();
  if(!tmdbId){posterMsg.textContent='NO TMDB ID';centerPlay.classList.remove('hidden');setLoading(false);return;}

  pageTitle.textContent='Movie '+tmdbId+' — Galactic V5';
  posterMsg.textContent='LOADING MOVIE '+tmdbId+'…';

  info('TMDB', tmdbId);
  info('IMDB', 'resolving…');

  // Use relative URL so it works on any host (Vercel or local)
  fetchJSON('/e/movie/'+encodeURIComponent(tmdbId)).then(function(json){
    var data=json.data||{};
    var title=data.title||'Unknown Movie';
    var backdrop=data.backdrop||'';
    var streamUrls=data.stream_urls||[];
    // Subtitles fetched client-side below
    info('IMDB', data.imdb_id||'—');
    info('Streams', streamUrls.length);
    info('Subs', 'fetching…');
    if(backdrop){posterArt.style.backgroundImage='url('+backdrop+')';video.poster=backdrop;}
    posterMsg.textContent=title;

    // Fetch subtitles client-side from /src/sub/:tmdb_id
    fetchJSON('/src/sub/'+encodeURIComponent(tmdbId)).then(function(subJson){
      var subs = subJson.subtitles || [];
      info('Subs', subs.length);
      if(streamUrls&&streamUrls.length>0){
        loadMovie(streamUrls[0], subs);
        toast(title,2500);
      } else {
        posterMsg.textContent='NO STREAM URL';
        centerPlay.classList.remove('hidden');
        setLoading(false);
        showError('No stream URLs returned for this movie.');
      }
    }).catch(function(subErr){
      console.error('Subtitle fetch error:', subErr);
      info('Subs', 'error');
      // Continue without subtitles
      if(streamUrls&&streamUrls.length>0){
        loadMovie(streamUrls[0], []);
        toast(title,2500);
      } else {
        posterMsg.textContent='NO STREAM URL';
        centerPlay.classList.remove('hidden');
        setLoading(false);
        showError('No stream URLs returned for this movie.');
      }
    });
  }).catch(function(err){
    console.error(err);
    posterMsg.textContent='ERROR: '+String(err.message||err);
    toast('Failed to load movie',4000);
    centerPlay.classList.remove('hidden');
    setLoading(false);
    showError('Failed to load movie: '+String(err.message||err));
  });

})();
</script>
</body>
</html>
